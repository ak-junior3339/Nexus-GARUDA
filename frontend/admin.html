<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GARUDA | Admin Console</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Evidence Vault Grid Styles */
    .vault-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .vault-card {
      background: #0a0f1d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .vault-card:hover {
      transform: translateY(-2px);
      border-color: #818cf8;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .vault-img-wrap {
      width: 100%;
      height: 175px;
      background: #000;
      cursor: pointer;
      position: relative;
    }
    .vault-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vault-meta {
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .vault-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .vault-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: bold;
      font-size: 10px;
    }
    .vault-badge--breach { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .vault-badge--group { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #c084fc; }
    .vault-badge--loiter { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #fbbf24; }

    /* Lightbox Modal */
    .image-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }
    .image-modal-overlay.is-open { display: flex; }
    .image-modal-content {
      background: #0c1222;
      border: 1px solid #3b42a4;
      border-radius: 4px;
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      font-family: var(--font-mono);
    }
    .image-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #04060d;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: #fff;
    }
    .image-modal-body {
      padding: 16px;
      display: flex;
      justify-content: center;
      background: #000;
    }
    .image-modal-body img {
      max-height: 65vh;
      max-width: 100%;
      object-fit: contain;
    }
    .image-modal-footer {
      padding: 10px 16px;
      background: #04060d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 11px;
      color: #94a3b8;
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.is-open {
      display: flex !important;
    }
  </style>
</head>
<body class="admin-body">

  <header class="topbar">
    <div class="topbar__brand">
      <img src="assets/garuda-logo.png" alt="GARUDA emblem" />
      <span>GARUDA</span>
    </div>

    <div class="topbar__center">
      <div class="btn-group" role="group" aria-label="Console navigation">
        <button type="button" class="is-active" id="tab-admin-console">ADMIN CONSOLE</button>
        <button type="button" id="tab-launch-dashboard">LAUNCH TACTICAL DASHBOARD</button>
      </div>
    </div>

    <div class="topbar__right">
      <div class="identity-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <strong id="admin-name">ADMIN ROOT</strong>&nbsp;|&nbsp;<span id="admin-id">---</span>
      </div>
      <button type="button" class="btn-logout" id="logout-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1 2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        LOG OUT
      </button>
    </div>
  </header>

  <main style="padding: 24px 32px;">

    <!-- ============================= OPERATOR ROSTER ============================= -->
    <section class="admin-section">
      <div class="admin-section__head" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="font-family: var(--font-mono); font-size: 16px;">OPERATOR &amp; SESSION CONTROL</h2>
        <button type="button" class="btn-primary" id="open-provision-modal" style="background: #3b42a4; color: #fff; border: 1px solid #818cf8; padding: 6px 14px; font-family: var(--font-mono); cursor: pointer;">+ PROVISION NEW OPERATOR</button>
      </div>

      <div class="admin-table-wrap" style="background: #0a0f1d; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden;">
        <table class="data-table" id="operator-table" style="width: 100%; border-collapse: collapse; font-family: var(--font-mono);">
          <thead>
            <tr style="background: #04060c; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #94a3b8; text-align: left;">
              <th style="padding: 10px 14px;">STATUS</th>
              <th style="padding: 10px 14px;">USER ID</th>
              <th style="padding: 10px 14px;">FULL NAME</th>
              <th style="padding: 10px 14px;">CLEARANCE</th>
              <th style="padding: 10px 14px;">ACTIONS</th>
            </tr>
          </thead>
          <tbody>
            <!-- Loaded via app.js -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- ============================= TACTICAL EVIDENCE VAULT ============================= -->
    <section class="admin-section" style="margin-top: 36px;">
      <div class="admin-section__head" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="font-family: var(--font-mono); font-size: 16px;">EVIDENCE &amp; BREACH IMAGE LIBRARY</h2>
        <button type="button" class="btn-mini" onclick="GarudaAdmin.loadEvidenceVault()" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; font-family: var(--font-mono); color: #fff; cursor: pointer;">↻ REFRESH VAULT</button>
      </div>

      <div class="vault-grid" id="vault-grid">
        <div style="grid-column: 1 / -1; padding: 30px; text-align: center; color: #64748b; font-family: var(--font-mono);">QUERYING DATABASE EVIDENCE PHOTOS...</div>
      </div>
    </section>

  </main>

  <!-- ============================= FULLSCREEN IMAGE INSPECTION MODAL ============================= -->
  <div class="image-modal-overlay" id="image-inspect-modal">
    <div class="image-modal-content">
      <div class="image-modal-header">
        <span id="modal-image-title" style="font-weight: bold; color: #818cf8;">EVIDENCE INSPECTION</span>
        <button type="button" onclick="document.getElementById('image-inspect-modal').classList.remove('is-open')" style="background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;">&times;</button>
      </div>
      <div class="image-modal-body">
        <img id="modal-image-src" src="" alt="Breach Evidence Full View" />
      </div>
      <div class="image-modal-footer">
        <span id="modal-image-meta">CAMERA INFO</span>
        <button type="button" class="btn-mini btn-mini--danger" id="modal-delete-btn" style="background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; padding: 4px 10px; cursor: pointer;">DELETE RECORD FROM DATABASE</button>
      </div>
    </div>
  </div>

  <!-- ============================= PROVISION OPERATOR MODAL (ORIGINAL UI) ============================= -->
  <div class="modal-overlay" id="provision-modal">
    <div class="modal-card" style="background: #0a0f1d; border: 1px solid #3b42a4; padding: 24px; max-width: 440px; width: 100%; border-radius: 4px; font-family: var(--font-mono);">
      <h3 style="margin-bottom: 16px; color: #fff; font-size: 15px; font-weight: bold;">ADD NEW OPERATOR</h3>
      <form id="provision-form" style="display: flex; flex-direction: column; gap: 14px;">
        <div>
          <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">USER ID</label>
          <input type="text" id="new-user-id" placeholder="ID-001" required style="width: 100%; padding: 8px; background: #04060d; border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: var(--font-mono); box-sizing: border-box;" />
        </div>
        <div>
          <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">FULL NAME</label>
          <input type="text" id="new-full-name" placeholder="Your Name" required style="width: 100%; padding: 8px; background: #04060d; border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: var(--font-mono); box-sizing: border-box;" />
        </div>
        <div>
          <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">ROLE</label>
          <select id="new-clearance" style="width: 100%; padding: 8px; background: #04060d; border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: var(--font-mono); box-sizing: border-box;">
            <option value="STANDARD OPERATOR">OPERATOR</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>
        <div>
          <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">PASSWORD</label>
          <input type="password" id="new-password" placeholder="••••••••" required style="width: 100%; padding: 8px; background: #04060d; border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: var(--font-mono); box-sizing: border-box;" />
        </div>
        <div style="display: flex; gap: 10px; margin-top: 12px;">
          <button type="submit" class="btn-primary" style="flex: 1; padding: 10px; background: #3b42a4; color: #fff; border: 1px solid #818cf8; cursor: pointer; font-family: var(--font-mono); font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center;">
            ADD
          </button>
          <button type="button" id="cancel-provision" style="flex: 1; padding: 10px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-family: var(--font-mono);">CANCEL</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      GarudaAdmin.init();
    });
  </script>
</body>
</html>
