<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GARUDA | Tactical Command Center</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* =========================================================================
       EXACT UNIFIED MILITARY TYPOGRAPHY (JETBRAINS MONO) & TACTICAL LAYOUT
       ========================================================================= */
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-canvas, #030712);
      color: var(--text-primary, #ffffff);
      font-family: var(--font-mono, 'JetBrains Mono', 'Roboto Mono', 'Space Mono', ui-monospace, monospace);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: var(--font-mono);
    }

    /* Full-Size Video Viewport Stage */
    .viewport-stage {
      display: flex;
      flex-direction: column;
      width: 100%;
      background: #000;
      position: relative;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      height: calc(100vh - 125px);
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #04060d;
      overflow: hidden;
    }

    .video-viewport img#active-camera-stream {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000;
    }

    /* Tactical Navigation Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(13, 20, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 28px;
      width: 54px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      border-radius: 4px;
      transition: all 0.2s ease;
      user-select: none;
      backdrop-filter: blur(4px);
    }
    .nav-arrow:hover {
      background: rgba(59, 66, 164, 0.9);
      border-color: #7b82ff;
      box-shadow: 0 0 14px rgba(123, 130, 255, 0.6);
    }
    .nav-arrow--prev { left: 20px; }
    .nav-arrow--next { right: 20px; }

    /* Camera Switcher Chips */
    .camera-selector-tray {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 30;
      background: rgba(5, 8, 17, 0.85);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
    }
    .cam-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 5px 14px;
      border-radius: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cam-chip:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .cam-chip.is-active {
      background: #3b42a4;
      border-color: #818cf8;
      color: #fff;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.6);
    }

    /* Fallback No-Network Screen */
    .no-network-fallback {
      display: none;
      position: absolute;
      inset: 0;
      background: #070b14;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      font-family: var(--font-mono);
      z-index: 20;
    }

    /* Aligned Meta Strip */
    .camera-meta-strip {
      background: #3b42a4;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.04em;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
    }

    /* Extended Downward Log Section */
    .downward-log-section {
      width: 100%;
      background: #070b14;
      padding: 24px 28px 60px 28px;
      box-sizing: border-box;
      border-top: 2px solid #1e293b;
      font-family: var(--font-mono);
    }

    .log-container-card {
      background: #0a0f1d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .incident-panel__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      background: #04060c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-mono);
    }

    .incident-panel__list {
      max-height: 480px;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .incident-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: rgba(255, 255, 255, 0.015);
      margin-bottom: 4px;
      border-radius: 2px;
      font-family: var(--font-mono);
      animation: fadeIn 0.25s ease;
    }
    .incident-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .incident-row .title {
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .incident-row .meta {
      color: #818cf8;
      font-size: 12px;
      margin: 0 20px;
      letter-spacing: 0.05em;
    }

    .incident-empty {
      padding: 48px 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-style: italic;
      font-size: 13px;
      font-family: var(--font-mono);
      letter-spacing: 0.08em;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="dashboard-container">

  <!-- ============================= TOPBAR ============================= -->
  <header class="topbar">
    <div class="nav-flag-accent"></div>

    <div class="topbar__brand">
      <img src="assets/garuda-logo.png" alt="GARUDA emblem" />
      <span>GARUDA</span>
    </div>

    <div class="topbar__center">
      <div class="btn-group" id="admin-nav-group" role="group" aria-label="Console navigation" style="display: none;">
        <button type="button" id="tab-admin-console">LAUNCH ADMIN CONSOLE</button>
        <button type="button" class="is-active" id="tab-launch-dashboard">OPERATOR DASHBOARD</button>
      </div>
    </div>

    <div class="topbar__right">
      <div class="identity-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <strong id="user-name">OPERATOR</strong>&nbsp;|&nbsp;<span id="user-id">---</span>
      </div>
      <button type="button" class="btn-logout" id="logout-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1 2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        LOG OUT
      </button>
    </div>
  </header>

  <!-- ============================= FULL SIZE VIDEO VIEWPORT ============================= -->
  <main class="viewport-stage">
    
    <div class="video-viewport">
      <img 
        id="active-camera-stream" 
        src="http://localhost:8000/api/v1/cameras/CAM-01/stream" 
        alt="Tactical Surveillance Feed"
        onerror="showNetworkOffline()"
      />

      <!-- Emergency Night Vision Button -->
      <button id="night-vision-btn" 
              style="position: absolute; top: 16px; right: 16px; z-index: 30; background: rgba(5,8,17,0.85); color: #94a3b8; border: 1px solid rgba(255,255,255,0.25); padding: 6px 14px; border-radius: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: bold; cursor: pointer; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 6px; transition: 0.2s;"
              title="Toggle Night Vision Enhancement (Hot-Key: N)">
        <span>🌙</span> NIGHT VISION: <strong id="night-mode-status" style="color: #64748b;">AUTO</strong> <span style="font-size: 9px; opacity: 0.6;">[N]</span>
      </button>

      <!-- Offline Fallback -->
      <div class="no-network-fallback" id="no-network-overlay">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        <h2 style="margin-top: 12px;">NO NETWORK / SIGNAL LOST</h2>
        <p style="color: #94a3b8; font-size: 12px;">CHECK RTSP OR VIDEO SOURCE CONNECTION</p>
      </div>

      <!-- Tactical Next / Prev Buttons -->
      <button class="nav-arrow nav-arrow--prev" id="cam-prev-btn" title="Previous Camera">&#10094;</button>
      <button class="nav-arrow nav-arrow--next" id="cam-next-btn" title="Next Camera">&#10095;</button>

      <!-- Auto-Discovered Camera Selector Chips -->
      <div class="camera-selector-tray" id="cam-selector-tray"></div>
    </div>

    <!-- Active Camera Status Bar -->
    <div class="camera-meta-strip">
      <span>
        <span class="dot dot--live"></span> 
        <strong id="active-cam-title">CAM-01: CHECKPOST ANPR</strong>
      </span>
      <span>
        <span id="active-cam-coords">28.6139°N 77.2090°E</span> &nbsp;|&nbsp; 
        <span class="cam-clock" data-cam-clock>--:--:-- IST</span>
      </span>
    </div>

  </main>

  <!-- ============================= EXTENDED DOWNWARD LOG SECTION ============================= -->
  <section class="downward-log-section">
    <div class="log-container-card">
      <div class="incident-panel__header">
        <span id="active-incident-heading" style="font-weight: 700; letter-spacing: 0.08em; font-size: 13px; color: #fff; font-family: var(--font-mono);">
          CAM-01 &middot; SURVEILLANCE &amp; THREAT  LOG
        </span>
        <span class="cam-badge" id="active-incident-count" data-count="0" style="padding: 4px 12px; font-size: 11px; font-family: var(--font-mono);">0 ENTRIES</span>
      </div>
      <div class="incident-panel__list" id="active-incident-list">
        <div class="incident-empty">LOG CLEAR — SYSTEM SCANNING ACTIVE SECTOR</div>
      </div>
    </div>
  </section>

</div>

<div class="toast-stack" id="toast-stack"></div>

<!-- Controller Scripts -->
<script src="app.js"></script>
<script>
  function showNetworkOffline() {
    const overlay = document.getElementById('no-network-overlay');
    if (overlay) overlay.style.display = 'flex';
  }

  document.addEventListener('DOMContentLoaded', () => {
    GarudaDashboard.init();
    if (typeof GarudaCameraViewer !== 'undefined') {
      GarudaCameraViewer.init();
    }
  });
</script>
</body>
</html>
